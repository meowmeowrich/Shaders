# Revolutionary Hybrid Shader Pack - Ultimate V3
# Targeted for Iris + Sodium on Fabric 1.21.1

# Render Targets
# colortex0: Scene Color (RGB), Emissive (A)
# colortex1: Normals (RGB), Roughness (A)
# colortex2: GI Cache / Indirect
# colortex3: Volumetric Data
# colortex4: Translucency
# colortex5: Temporal History

buffer.colortex0.format=RGBA16F
buffer.colortex1.format=RGBA16F
buffer.colortex2.format=RGBA16F
buffer.colortex3.format=RGBA16F
buffer.colortex4.format=RGBA16F
buffer.colortex5.format=RGBA16F

# Shader Program Configurations
shadowMapResolution=4096
shadowDistance=160.0

# Setting Up the Menu
option.VISUAL_QUALITY=Visual Quality
value.VISUAL_QUALITY.0=Potato
value.VISUAL_QUALITY.1=Low
value.VISUAL_QUALITY.2=Medium
value.VISUAL_QUALITY.3=High
value.VISUAL_QUALITY.4=Ultra
value.VISUAL_QUALITY.5=Cinematic

option.LIGHTING_MODE=Lighting Mode
value.LIGHTING_MODE.0=Direct
value.LIGHTING_MODE.1=Hybrid GI

option.VOLUMETRIC_FOG=Volumetric Fog
option.SSR=Screen Space Reflections
option.TAA=Temporal Anti-Aliasing
